description: >-
  Cross-cutting runtime semantics for the Groupon API, established by probing the
  live gateway. Groupon publishes no anonymously-readable OpenAPI and its
  developer documentation is behind a bot challenge, so most dimensions below are
  honestly recorded as unknown rather than assumed. Everything marked with
  evidence was observed on the wire.
auth:
  style: api-key
  parameter: client_id
  location: query
  detail: authentication/groupon-authentication.yml
idempotency:
  coverage: none
  supported: false
  header: null
  scope: []
  retention: null
  note: >-
    No idempotency mechanism could be established. The gateway advertises no
    Idempotency-Key or equivalent header, returns no idempotency-related hint on
    any anonymous response, and the documentation that would state one is
    unreadable to any machine client. Recorded as `none` — the honest reading of
    "no replay protection is discoverable" — not as `partial`. If Groupon
    documents an idempotency key on a write operation, this artifact should be
    upgraded to searched and the coverage restated.
reversibility:
  state: unknown
  grade: null
  note: >-
    Not determinable. No write surface is reachable anonymously (every path
    returns 401) and the reference that would name cancel/refund/void operations
    and their windows is behind a bot challenge. Groupon obviously operates
    reversal flows as a business — the Groupon Promise refund policy is published
    at https://www.groupon.com/legal/grouponpromise — but that is a consumer
    policy page, NOT an API reversal operation with a stated window, and asserting
    an API window from it would be an invention. Deliberately left unstated: an
    invented reversal window is the one error here that could cost a user money.
    This is not `na` — Groupon's booking and reservation APIs certainly have write
    operations (Create Reservation, Create Booking, Cancellation are named in the
    indexed documentation titles); their reversibility is simply unreadable.
  write_surface_exists: true
  reversal_operations: []

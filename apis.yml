apis:
  - aid: groupon:groupon-api
    name: Groupon API
    description: >-
      Groupon's own public API gateway. Live and Groupon-operated (responses carry
      x-brand: groupon and Envoy/GCP upstream headers), but gated: every path,
      including /v2/deals.json, /graphql and /.well-known/*, returns HTTP 401 with
      {"error":{"httpCode":401,"message":"'client_id' is invalid"}} until a valid
      client_id query parameter is supplied. Because the gateway returns the same
      401 for paths that do not exist, its operation set could not be enumerated
      anonymously and no OpenAPI has been derived for it.
    humanURL: https://www.groupon.com/developers
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/groupon.png
    baseURL: https://api.groupon.com
    tags:
      - Deals
      - Local Commerce
    properties:
      - type: DeveloperPortal
        url: https://www.groupon.com/developers
      - type: Authentication
        url: authentication/groupon-authentication.yml
      - type: ErrorCatalog
        url: errors/groupon-problem-types.yml
  - aid: groupon:groupon-bookable-appointments-api
    name: Groupon Bookable Appointments API
    description: >-
      REST contract for wellness, beauty and services booking systems. Groupon polls
      the partner's system roughly every 60 minutes to cache merchants, services,
      staff and availability, performs a real-time availability check before
      checkout, creates the booking, propagates cancellations initiated on Groupon's
      side, and updates booking status on redemption. Groupon publishes the OpenAPI
      and CONSUMES the contract — the endpoints run on the partner's own host, so
      there is no Groupon-hosted base URL for this API and none has been invented.
    humanURL: https://www.groupon.com/developers-docs/bookable-appointments
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/groupon.png
    tags:
      - Bookings
      - Appointments
    properties:
      - type: Documentation
        url: https://www.groupon.com/developers-docs/bookable-appointments
      - type: APIReference
        url: https://www.groupon.com/developers/api-reference
  - aid: groupon:groupon-tours-and-attractions-api
    name: Groupon Tours and Attractions API
    description: >-
      REST contract connecting a tours, activities and attractions reservation
      system to Groupon's point of sale, covering availability, reservation
      creation and retrieval, cancellation and redemption. As with Bookable
      Appointments, Groupon publishes the OpenAPI and consumes the contract; the
      endpoints are hosted by the partner, so no Groupon base URL applies.
    humanURL: https://www.groupon.com/developers-docs/tours-and-attractions
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/groupon.png
    tags:
      - Bookings
      - Reservations
      - Travel
    properties:
      - type: Documentation
        url: https://www.groupon.com/developers-docs/tours-and-attractions
      - type: APIReference
        url: https://www.groupon.com/developers/api-reference

description: >-
  Groupon is a local-commerce marketplace, founded in Chicago in 2008, where people
  discover and book discounted experiences, services, goods and travel — things to
  do, food and drink, beauty and spas, health and fitness, home and auto services,
  retail goods, getaways and retailer coupons. Its developer surface is a partner
  and merchant integration programme rather than a public product API: the Groupon
  Developer Platform publishes REST contracts for Bookable Appointments, Tours and
  Attractions, Goods Marketplace inventory and point-of-sale redemption, which
  partner booking and reservation systems implement so Groupon can poll availability,
  create reservations and signal redemptions. A separate Groupon-operated API gateway
  runs at api.groupon.com and requires a client_id on every request. The Groupon
  Partner Network affiliate reporting APIs were permanently closed on 2022-06-15.

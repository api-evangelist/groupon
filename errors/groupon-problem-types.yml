description: >-
  Groupon publishes no anonymously-readable OpenAPI, so this catalog records only
  error responses OBSERVED on the live gateway. api.groupon.com returns a
  consistent JSON envelope with a single top-level "error" object carrying an
  integer httpCode and a human message. It is NOT RFC 9457 / RFC 7807: the
  content-type is application/json, not application/problem+json, and there is no
  type, title, detail, status or instance member. Only the 401 shape could be
  observed anonymously; every path returns it, so no 4xx other than 401 and no 5xx
  is reachable without a credential. NOTHING BELOW IS INFERRED — no error codes,
  titles or remediation have been invented to fill the catalog.
envelope:
  shape: '{"error": {"httpCode": <int>, "message": <string>}}'
  media_type: application/json; charset=utf-8
  fields:
    - name: error.httpCode
      type: integer
      note: Mirrors the HTTP status code.
    - name: error.message
      type: string
      note: Human-readable message. Not a stable machine code — no error identifier is returned.
  machine_code: false
  note: >-
    The envelope carries no stable symbolic error code, only prose in
    error.message. An agent cannot branch on this reliably.
